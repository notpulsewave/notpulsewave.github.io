<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseWave | Minecraft YouTube Channel</title>
  <style>
    :root {
      --bg-dark: #000000;
      --bg-panel: #0a0a0a;
      --text: #ffffff;
      --muted: #aaaaaa;
      --accent: #ff0000;
      --accent-dark: #cc0000;
      --shadow: rgba(255, 0, 0, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #050505, #1a0000);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 920px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid rgba(255, 0, 0, 0.2);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
    }

    .topbar {
      height: 6px;
      background: linear-gradient(to right, #ff0000, #8b0000);
    }

    .hero {
      padding: 60px 40px 50px;
      text-align: center;
      background: rgba(255, 0, 0, 0.02);
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 0, 0, 0.15);
      border: 1px solid rgba(255, 0, 0, 0.4);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(3rem, 8vw, 5.8rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 0.9;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    h1 span {
      color: #ff3333;
    }

    .subtitle {
      max-width: 520px;
      margin: 0 auto 32px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      text-decoration: none;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      border: none;
      font-size: 0.95rem;
      min-width: 150px;
      position: relative;
      overflow: hidden; /* Ensures ripple stays inside button */
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .primary {
      background: #ff0000;
      color: #ffffff;
      box-shadow: 0 8px 0 #8b0000;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .primary:hover {
      background: #ff1a1a;
    }

    .secondary {
      background: #1a0000;
      color: var(--text);
      border: 1px solid rgba(255, 0, 0, 0.3);
      box-shadow: 0 4px 0 #330000;
    }

    .secondary:hover {
      background: #2a0000;
      border-color: rgba(255, 0, 0, 0.6);
    }

    /* Ripple Effect Styles */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.6);
      transform: scale(0);
      animation: ripple-anim 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .bottom {
      padding: 18px 40px;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.5);
      border-top: 1px solid rgba(255,0,0,0.1);
    }
    
    .bottom a {
      color: #ff4d4d;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Main Content (Password Screen Removed) -->
  <main class="container" id="main-content">
    <div class="topbar"></div>

    <section class="hero">
      <div class="badge">MINECRAFT CHANNEL</div>
      <h1><span>PulseWave</span></h1>
      <p class="subtitle">
        Clean Minecraft content — builds, gameplay, and creative moments.
      </p>

      <div class="buttons">
        <a class="btn primary" href="https://www.youtube.com/@notpulsewave" target="_blank">Watch on YouTube</a>
        <a class="btn primary" href="minecraft.html">Play Minecraft</a>
        <a class="btn secondary" href="https://www.youtube.com/@notpulsewave?sub_confirmation=1" target="_blank">Subscribe</a>
        <a class="btn secondary" href="cvids">Cvids (Unblocked)</a>
        <a class="btn secondary" href="LHSnews" target="_blank">LHS News</a>
        <a class="btn secondary" href="messages.html" target="_blank">Messages</a>
        <a class="btn secondary" href="mineclip" target="_blank">Mineclip</a>
        <a class="btn secondary" href="67.html" target="_blank">67</a>
        <a class="btn primary" href="amplerlauncher" target="_blank">Ampler Launcher</a>
      </div>
    </section>

    <div class="bottom">
      © 2026 PulseWave • <a href="https://www.youtube.com/@notpulsewave" target="_blank">youtube.com/@notpulsewave</a>
    </div>
  </main>

  <script>
    // Ripple Effect Logic
    const buttons = document.querySelectorAll('.btn');

    buttons.forEach(btn => {
      btn.addEventListener('mouseenter', function(e) {
        // Create ripple element
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        
        // Get button dimensions
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        
        // Set size and position to center of button
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${rect.width / 2 - size / 2}px`;
        ripple.style.top = `${rect.height / 2 - size / 2}px`;
        
        // Append to button
        btn.appendChild(ripple);
        
        // Remove ripple after animation ends
        setTimeout(() => {
          ripple.remove();
        }, 600); // Matches animation duration
      });
    });
  </script>
</body>
</html>
