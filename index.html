<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseWave | Minecraft YouTube Channel</title>
  <style>
    :root {
      --bg1: #1b2e1f;
      --bg2: #2f5b36;
      --text: #f4f8f1;
      --muted: #d4e3d2;
      --accent: #7ee081;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.18)),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: 0.4;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 980px;
      border-radius: 24px;
      overflow: hidden;
      background: rgba(34, 52, 37, 0.82);
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow: 0 24px 70px var(--shadow);
      backdrop-filter: blur(10px);
    }

    .topbar {
      height: 18px;
      background: linear-gradient(90deg, #3b6f45 0 25%, #4f8a55 25% 50%, #6aac67 50% 75%, #8dcf84 75% 100%);
    }

    .hero {
      padding: 64px 32px 44px;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(126, 224, 129, 0.18), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(126, 224, 129, 0.14);
      border: 1px solid rgba(126, 224, 129, 0.25);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 0.95;
      font-family: "Courier New", monospace;
      letter-spacing: 0.04em;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.22);
    }

    h1 span {
      color: #eaf9ea;
    }

    .subtitle {
      margin: 0 auto 18px;
      max-width: 780px;
      color: var(--muted);
      font-size: 1.06rem;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .btn {
      text-decoration: none;
      font-weight: 700;
      padding: 14px 22px;
      border-radius: 12px;
      display: inline-block;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      border: 2px solid rgba(0,0,0,0.25);
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .primary {
      color: #163117;
      background: linear-gradient(180deg, #bff6c2 0%, #7ee081 100%);
      box-shadow: 0 6px 0 #4f9c53, 0 12px 24px rgba(126, 224, 129, 0.25);
    }

    .primary:hover {
      box-shadow: 0 10px 0 #3f8442, 0 16px 28px rgba(126, 224, 129, 0.3);
    }

    .secondary {
      color: var(--text);
      background: linear-gradient(180deg, #5f9a63 0%, #3f6f45 100%);
      box-shadow: 0 6px 0 #25462a, 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    .secondary:hover {
      box-shadow: 0 10px 0 #1f3823, 0 16px 28px rgba(0, 0, 0, 0.25);
    }

    .bottom {
      padding: 0 32px 28px;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 0.92rem;
    }

    a { color: inherit; }
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar"></div>

    <section class="hero">
      <div class="badge">Minecraft Channel</div>
      <h1><span>PulseWave</span></h1>
      <p class="subtitle">
        Minecraft content with a clean blocky theme — builds, gameplay, and creative moments
        from PulseWave.
      </p>

      <div class="buttons">
        <a class="btn primary" href="https://www.youtube.com/@notpulsewave" target="_blank" rel="noopener noreferrer">
          Watch on YouTube
        </a>
        <a class="btn secondary" href="minecraft.html">
          Play Minecraft
        </a>
        <a class="btn secondary" href="https://www.youtube.com/@notpulsewave?sub_confirmation=1" target="_blank" rel="noopener noreferrer">
          Subscribe
        </a>
         <a class="btn secondary" href="cvids">
          Cvids(unblocked videos)
        </a>
        <a class="btn secondary" href="LHSnews" target="_blank" rel="noopener noreferrer">
          LHS Chromebook News
        </a>
      </div>
    </section>

    <div class="bottom">
      © 2026 PulseWave • <a href="https://www.youtube.com/@notpulsewave" target="_blank" rel="noopener noreferrer">youtube.com/@notpulsewave</a>
    </div>
  </main>
</body>
</html>
