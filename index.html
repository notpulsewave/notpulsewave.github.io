<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseWave | Minecraft YouTube Channel</title>
  <style>
    :root {
      --bg1: #1b2e1f;
      --bg2: #2f5b36;
      --text: #f4f8f1;
      --muted: #d4e3d2;
      --accent: #7ee081;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 920px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(30, 45, 32, 0.95);
      border: 1px solid rgba(126, 224, 129, 0.2);
      box-shadow: 0 30px 80px var(--shadow);
    }

    .topbar {
      height: 6px;
      background: linear-gradient(to right, #7ee081, #4f9c53);
    }

    .hero {
      padding: 60px 40px 50px;
      text-align: center;
      background: rgba(255,255,255,0.03);
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(126, 224, 129, 0.12);
      border: 1px solid rgba(126, 224, 129, 0.3);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(3rem, 8vw, 5.8rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 0.9;
    }

    h1 span {
      color: #c8f0c8;
    }

    .subtitle {
      max-width: 520px;
      margin: 0 auto 32px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      text-decoration: none;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      border: none;
      font-size: 0.95rem;
      min-width: 150px;
    }

    .btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .primary {
      background: #7ee081;
      color: #1a2f1f;
      box-shadow: 0 8px 0 #4f9c53;
    }

    .secondary {
      background: #3b5f40;
      color: var(--text);
      border: 1px solid rgba(126, 224, 129, 0.25);
    }

    .bottom {
      padding: 18px 40px;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.15);
    }

    /* Password Screen */
    #password-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1b2e1f, #2f5b36);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .password-box {
      background: rgba(30, 45, 32, 0.95);
      padding: 40px 50px;
      border-radius: 20px;
      border: 1px solid rgba(126, 224, 129, 0.2);
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      text-align: center;
      width: 100%;
      max-width: 380px;
    }

    .password-box h2 {
      margin: 0 0 24px;
      font-size: 1.6rem;
    }

    .password-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.05rem;
      border: 2px solid rgba(126, 224, 129, 0.3);
      border-radius: 10px;
      background: #1b2e1f;
      color: var(--text);
      margin-bottom: 16px;
      outline: none;
    }

    .password-box input:focus {
      border-color: #7ee081;
    }

    .password-box button {
      width: 100%;
      padding: 14px;
      font-weight: 700;
      border-radius: 10px;
      background: #7ee081;
      color: #1a2f1f;
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }

    .error {
      color: #ff8a8a;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Password Screen -->
  <div id="password-screen">
    <div class="password-box">
      <h2>Enter Password</h2>
      <input type="password" id="password-input" placeholder="Password">
      <button onclick="checkPassword()">Unlock</button>
      <p class="error" id="error-msg">Incorrect password</p>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container" id="main-content" style="display: none;">
    <div class="topbar"></div>

    <section class="hero">
      <div class="badge">MINECRAFT CHANNEL</div>
      <h1><span>PulseWave</span></h1>
      <p class="subtitle">
        Clean Minecraft content — builds, gameplay, and creative moments.
      </p>

      <div class="buttons">
        <a class="btn primary" href="https://www.youtube.com/@notpulsewave" target="_blank">Watch on YouTube</a>
        <a class="btn primary" href="minecraft.html">Play Minecraft</a>
        <a class="btn secondary" href="https://www.youtube.com/@notpulsewave?sub_confirmation=1" target="_blank">Subscribe</a>
        <a class="btn secondary" href="cvids">Cvids (Unblocked)</a>
        <a class="btn secondary" href="LHSnews" target="_blank">LHS News</a>
        <a class="btn secondary" href="messages.html" target="_blank">Messages</a>
        <a class="btn secondary" href="mineclip" target="_blank">Mineclip</a>
        <a class="btn secondary" href="67.html" target="_blank">67</a>
        <a class="btn primary" href="amplerlauncher" target="_blank">Ampler Launcher</a>
      </div>
    </section>

    <div class="bottom">
      © 2026 PulseWave • <a href="https://www.youtube.com/@notpulsewave" target="_blank">youtube.com/@notpulsewave</a>
    </div>
  </main>

  <script>
    function checkPassword() {
      const input = document.getElementById('password-input').value;
      const error = document.getElementById('error-msg');
      
      if (input === 'NotPulseWave_YT') {
        document.getElementById('password-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
      } else {
        error.style.display = 'block';
      }
    }

    // Allow Enter key to submit
    document.getElementById('password-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });
  </script>
</body>
</html>
