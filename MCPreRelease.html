<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseWave | Eaglercraft Modded Launcher</title>
  <style>
    /* Pulse Theme Inspired Variables */
    :root {
      --launcher-bg-dark: #121212; /* Deep black for main background */
      --launcher-bg-panel: #1a1a1a; /* Slightly lighter black for sidebar/top nav */
      --text-primary: #f0f0f0; /* White/light grey text */
      --text-secondary: #a0a0a0; /* Muted grey text */

      /* Dynamic Accent Color (Default to Pulse Red) */
      --accent-red: #E53935; /* Primary Pulse Red */
      --accent-red-dark: #C62828; /* Darker Pulse Red for hover/active */
      --play-button-bg: var(--accent-red);
      --play-button-hover: var(--accent-red-dark);

      --border-subtle: rgba(255, 255, 255, 0.05);
      --shadow-dark: rgba(0, 0, 0, 0.5);

      /* Modal specific colors */
      --modal-bg-overlay: rgba(0, 0, 0, 0.7);
      --modal-content-bg: var(--launcher-bg-dark);
      --modal-border: var(--border-subtle);
    }

    /* Generic reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      color: var(--text-primary);
      background-color: var(--launcher-bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .launcher-container {
      width: 100%;
      max-width: 1200px;
      height: 700px;
      display: flex;
      background-color: var(--launcher-bg-dark);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 60px var(--shadow-dark);
    }

    /* Sidebar Styles */
    .sidebar {
      flex: 0 0 250px;
      background-color: var(--launcher-bg-panel);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
      border-right: 1px solid var(--border-subtle);
    }

    .sidebar-nav-main, .sidebar-nav-bottom {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar .nav-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.95rem;
      transition: background-color 0.2s, color 0.2s;
      line-height: 1.3;
      font-weight: 500;
      cursor: pointer; /* Indicate clickability */
    }

    .sidebar .nav-item .icon {
      margin-right: 15px;
      font-size: 1.2rem;
      color: var(--text-secondary);
      width: 24px;
      text-align: center;
    }

    .sidebar .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .sidebar .nav-item.active {
      color: var(--accent-red);
      background-color: rgba(229, 57, 53, 0.1); /* Use accent-red with opacity */
      position: relative;
    }

    .sidebar .nav-item.active .icon {
        color: var(--accent-red);
    }

    .sidebar .nav-item.active::before { /* Red bar on active item */
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background-color: var(--accent-red);
    }

    /* Main Content Styles */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--launcher-bg-dark);
    }

    /* Top Navigation (Only title remains) */
    .top-nav {
      background-color: var(--launcher-bg-panel);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
    }

    .top-nav .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    /* Hero Banner Styles */
    .hero-banner {
      flex-grow: 1;
      position: relative;
      /* Placeholder image for red/dark theme */
      background-image: url('https://via.placeholder.com/1000x500/1e0a0a/E53935?text=EAGLERCRAFT+MODDED+EDITION');
      background-size: cover;
      background-position: center center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-banner::before { /* Dark overlay for text readability */
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 40%);
    }

    .hero-banner .logo {
      position: relative;
      text-align: center;
      color: var(--text-primary);
      font-family: 'Minecraftia', 'Press Start 2P', monospace; /* Placeholder if custom font not loaded */
      -webkit-font-smoothing: antialiased;
    }

    .hero-banner .eagler,
    .hero-banner .craft {
        display: inline-block;
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: bold;
        text-shadow:
            -2px -2px 0 #333,
            2px -2px 0 #333,
            -2px 2px 0 #333,
            2px 2px 0 #333,
            4px 4px 0 #444,
            6px 6px 0 #555;
        line-height: 1;
    }

    .hero-banner .craft {
        color: #ddd;
    }

    .hero-banner .eagler {
        color: var(--text-primary);
    }

    .hero-banner .subtext {
        font-size: clamp(0.8rem, 2vw, 1.5rem);
        margin-top: 10px;
        color: var(--accent-red); /* Uses accent color */
        text-shadow:
            -1px -1px 0 #5f100a, /* Darker red for subtext shadow */
            1px -1px 0 #5f100a,
            -1px 1px 0 #5f100a,
            1px 1px 0 #5f100a;
        letter-spacing: 1px;
        font-weight: 600;
    }

    /* Play Bar Styles */
    .play-bar {
      background-color: var(--launcher-bg-panel);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
    }

    .client-selector {
      display: flex;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 8px 15px;
      position: relative;
      cursor: pointer;
      min-width: 250px;
    }

    .client-selector::after {
        content: '▼';
        font-size: 0.7rem;
        color: var(--text-secondary);
        position: absolute;
        right: 15px;
        pointer-events: none;
    }

    .client-icon {
      width: 30px;
      height: 30px;
      background-color: #8A2BE2; /* Default placeholder color for Astra - can be dynamic */
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--text-primary);
      margin-right: 10px;
    }

    .client-details {
      flex-grow: 1;
    }

    .client-details select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background: transparent;
      border: none;
      width: 100%;
      color: var(--text-primary);
      font-size: 0.95rem;
      padding-right: 20px;
      cursor: pointer;
    }

    .client-details select:focus {
        outline: none;
    }

    .client-details optgroup {
      background-color: var(--launcher-bg-panel);
      color: var(--text-primary);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .client-details option {
      background-color: var(--launcher-bg-dark);
      color: var(--text-primary);
      padding: 5px;
      font-size: 0.9rem;
    }

    .client-details .client-version {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .play-button {
      background-color: var(--play-button-bg);
      color: var(--text-primary);
      font-size: 1.3rem;
      font-weight: bold;
      padding: 15px 40px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .play-button:hover {
      background-color: var(--play-button-hover);
    }

    .youtube-link {
      font-size: 0.9rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .youtube-link a {
      color: var(--accent-red); /* Uses accent color */
      text-decoration: none;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: var(--modal-bg-overlay);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: var(--modal-content-bg);
      margin: auto;
      padding: 30px;
      border: 1px solid var(--modal-border);
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px var(--shadow-dark);
      position: relative;
    }

    .modal-content h2 {
        color: var(--text-primary);
        margin-bottom: 20px;
        font-size: 1.5rem;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 10px;
    }

    .modal-content label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    .modal-content input[type="text"],
    .modal-content input[type="color"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        background-color: var(--launcher-bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: 4px;
        color: var(--text-primary);
        font-size: 1rem;
    }

    .modal-content input[type="text"]:focus,
    .modal-content input[type="color"]:focus {
        outline: none;
        border-color: var(--accent-red);
        box-shadow: 0 0 0 2px rgba(229, 57, 53, 0.3);
    }

    /* Specific styling for color input */
    .modal-content input[type="color"] {
        height: 40px;
        padding: 0;
        appearance: none;
        -moz-appearance: none;
        -webkit-appearance: none;
        border: none;
        background: transparent;
        cursor: pointer;
    }

    .modal-content input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
    }

    .modal-content input[type="color"]::-webkit-color-swatch {
        border: 1px solid var(--border-subtle);
        border-radius: 4px;
    }
    .modal-content input[type="color"]::-moz-color-swatch {
        border: 1px solid var(--border-subtle);
        border-radius: 4px;
    }


    .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }

    .modal-button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: background-color 0.2s, color 0.2s;
    }

    .modal-button.save {
        background-color: var(--accent-red);
        color: var(--launcher-bg-panel);
    }

    .modal-button.save:hover {
        background-color: var(--accent-red-dark);
    }

    .modal-button.cancel {
        background-color: var(--launcher-bg-panel);
        color: var(--text-secondary);
        border: 1px solid var(--border-subtle);
    }

    .modal-button.cancel:hover {
        background-color: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
    }

    /* Scrollbar styling for main content (if it gets scrollable) */
    .main-content::-webkit-scrollbar {
      width: 8px;
    }

    .main-content::-webkit-scrollbar-track {
      background: var(--launcher-bg-dark);
    }

    .main-content::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      border: 2px solid var(--launcher-bg-dark);
    }

    .main-content::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="launcher-container">
    <aside class="sidebar">
      <nav class="sidebar-nav-main">
        <a href="#" class="nav-item active" data-nav-id="web-edition">
          <span class="icon">📦</span>

        </a>
        <a href="#" class="nav-item" data-nav-id="modded-editions">

        </a>
        <a href="#" class="nav-item" data-nav-id="mobile-controller">

        </a>

      <nav class="sidebar-nav-bottom">

    <main class="main-content">

  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h2>Settings</h2>
      <label for="usernameInput">Display Name (e.g., YouTube Channel Name):</label>
      <input type="text" id="usernameInput" value="NotPulseWave_YT">

      <label for="accentColorInput" style="margin-top: 15px;">Theme Accent Color:</label>
      <input type="color" id="accentColorInput" value="#E53935">

      <div class="modal-buttons">
        <button class="modal-button cancel" id="cancelSettings">Cancel</button>
        <button class="modal-button save" id="saveSettings">Save</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const clientSelect = document.getElementById('clientSelect');
        const clientVersionDisplay = document.getElementById('clientVersion');
        const clientIcon = document.querySelector('.client-icon');
        const playButton = document.getElementById('playButton');

        const sidebarNavItems = document.querySelectorAll('.sidebar .nav-item');
        const settingsButton = document.getElementById('settingsButton');
        const settingsModal = document.getElementById('settingsModal');
        const usernameInput = document.getElementById('usernameInput');
        const accentColorInput = document.getElementById('accentColorInput');
        const saveSettingsButton = document.getElementById('saveSettings');
        const cancelSettingsButton = document.getElementById('cancelSettings');
        const displayNameElement = document.getElementById('displayName');

        // Default values
        const defaultDisplayName = 'NotPulseWave_YT';
        const defaultAccentColor = '#E53935'; // Pulse Red

        // Function to darken a hex color
        function darkenColor(hex, percent) {
            let f=parseInt(hex.slice(1),16),t=percent<0?0:255,p=percent<0?percent*-1:percent,R=f>>16,G=(f>>8) 0x00ff,B=f 0x0000ff;
            return "#"+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
        }

        // Function to apply theme colors
        function applyThemeColor(color) {
            document.documentElement.style.setProperty('--accent-red', color);
            const darkerColor = darkenColor(color, -0.15); // Darken by 15%
            document.documentElement.style.setProperty('--accent-red-dark', darkerColor);
            document.documentElement.style.setProperty('--play-button-bg', color);
            document.documentElement.style.setProperty('--play-button-hover', darkerColor);
            
            const subtextElement = document.querySelector('.hero-banner .subtext');
            if (subtextElement) {
                subtextElement.style.color = color;
                const shadowColor = darkenColor(color, -0.4); // Even darker for shadow
                subtextElement.style.textShadow = `-1px -1px 0 {shadowColor}, 1px -1px 0 {shadowColor}, -1px 1px 0 {shadowColor}, 1px 1px 0 {shadowColor}`;
            }
        }

        // Function to update client display (icon and version)
        const clientIconColors = {
            "https://example.com/astra-client": "#8A2BE2",
            "https://example.com/java-120-client": "#DAA520",
            "https://example.com/eaglercraft-121-preview": "#4682B4",
            "https://example.com/pixelclient-188-wasm": "#8B0000",
            "https://example.com/pixelclient-1122-wasm": "#B22222",
            "https://example.com/eb-lite-cu2-offline": "#008080",
            "https://example.com/eb-nextgen-client": "#4B0082",
            "https://example.com/modern-client": "#006400",
            "https://example.com/nebula-client": "#800080",
            "https://example.com/odd-future-client": "#FF4500",
            "https://example.com/resent-pvp-client": "#00BFFF",
            "https://example.com/peak-legacy-client": "#8B4513",
            "https://example.com/tuff-client": "#708090",
            "https://example.com/hacked-client": "#FF0000",
            "https://example.com/death-client": "#424242",
            "https://example.com/dragonxv2-client": "#FFD700",
        };

        function updateClientDisplay() {
            const selectedOption = clientSelect.options[clientSelect.selectedIndex];
            const version = selectedOption.dataset.version;
            const clientName = selectedOption.textContent;

            clientVersionDisplay.textContent = version;
            clientIcon.textContent = clientName.charAt(0).toUpperCase();
            clientIcon.style.backgroundColor = clientIconColors[selectedOption.value] || '#607D8B';
        }

        // Function to handle sidebar navigation clicks
        function handleSidebarNavClick(event) {
            event.preventDefault();
            sidebarNavItems.forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            if (event.currentTarget.id === 'settingsButton') {
                openSettingsModal();
            }
            // console.log("Navigating to:", event.currentTarget.dataset.navId);
        }

        // Function to open the settings modal
        function openSettingsModal() {
            usernameInput.value = displayNameElement.textContent;
            accentColorInput.value = localStorage.getItem('savedAccentColor') || defaultAccentColor;
            settingsModal.style.display = 'flex';
        }

        // Function to close the settings modal
        function closeSettingsModal() {
            settingsModal.style.display = 'none';
            // Deactivate "Settings" item and reactivate "Web Edition" if no other item is clicked
            const settingsNavItem = document.getElementById('settingsButton');
            const webEditionNavItem = document.querySelector('[data-nav-id="web-edition"]');

            if (settingsNavItem    settingsNavItem.classList.contains('active')) {
                settingsNavItem.classList.remove('active');
                if (webEditionNavItem) {
                    webEditionNavItem.classList.add('active');
                }
            }
        }

        // Event Listeners
        clientSelect.addEventListener('change', updateClientDisplay);

        playButton.addEventListener('click', () => {
            const selectedClientUrl = clientSelect.value;
            if (selectedClientUrl    selectedClientUrl.startsWith('https://')) { // Check if it's a valid URL
                window.location.href = selectedClientUrl;
            } else {
                console.warn('Attempted to launch non-URL client:', selectedClientUrl);
                alert('This client does not have a valid web URL configured. For this demo, please select a client with an "https://" value, or provide proper paths/launchers.');
            }
        });

        sidebarNavItems.forEach(item => {
            item.addEventListener('click', handleSidebarNavClick);
        });

        saveSettingsButton.addEventListener('click', () => {
            displayNameElement.textContent = usernameInput.value || defaultDisplayName;
            localStorage.setItem('savedDisplayName', usernameInput.value || defaultDisplayName);

            const newAccentColor = accentColorInput.value;
            applyThemeColor(newAccentColor);
            localStorage.setItem('savedAccentColor', newAccentColor);

            closeSettingsModal();
        });

        cancelSettingsButton.addEventListener('click', closeSettingsModal);

        settingsModal.addEventListener('click', (event) => {
            if (event.target === settingsModal) {
                closeSettingsModal();
            }
        });

        // --- Initialization on page load ---
        // Load and apply saved display name
        const savedDisplayName = localStorage.getItem('savedDisplayName');
        if (savedDisplayName) {
            displayNameElement.textContent = savedDisplayName;
        } else {
            displayNameElement.textContent = defaultDisplayName;
        }

        // Load and apply saved accent color
        const savedAccentColor = localStorage.getItem('savedAccentColor');
        if (savedAccentColor) {
            applyThemeColor(savedAccentColor);
            accentColorInput.value = savedAccentColor;
        } else {
            applyThemeColor(defaultAccentColor);
            accentColorInput.value = defaultAccentColor;
        }

        // Set initial client display (for Astra Client by default)
        updateClientDisplay();

        // Ensure "Web Edition" is active by default on load
        document.querySelector('[data-nav-id="web-edition"]').classList.add('active');
    });
  </script>
</body>
</html>
