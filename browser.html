<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Breach Browser</title>
    <style>
        body { margin: 0; background: #0a0a0a; font-family: 'Courier New', monospace; color: #ff0000; overflow: hidden; }
        
        #controls {
            background: #000;
            padding: 15px;
            border-bottom: 2px solid #ff0000;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input { 
            background: #000; border: 1px solid #ff0000; color: #ff0000; 
            padding: 8px; flex-grow: 1; font-family: inherit;
        }

        .pulse-btn {
            background: transparent; color: #ff0000; border: 1px solid #ff0000;
            padding: 8px 20px; cursor: pointer; position: relative; overflow: hidden; 
            transition: 0.3s; text-transform: uppercase;
        }
        .pulse-btn:hover { color: #000; background: #ff0000; }
        
        .pulse-btn::after {
            content: ""; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            background: rgba(255, 255, 255, 0.5); border-radius: 50%;
            transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s;
        }
        .pulse-btn:hover::after { width: 300%; height: 300%; }

        iframe { width: 100vw; height: calc(100vh - 65px); border: none; }
    </style>
</head>
<body>

<div id="controls">
    <button class="pulse-btn" onclick="goHome()">HOME</button>
    <input type="text" id="urlInput" placeholder="Enter URL or Search Query...">
    <button class="pulse-btn" onclick="processInput()">GO</button>
</div>

<iframe id="browser-view" src="https://notpulsewave.github.io/minecraft"></iframe>

<script>
    const iframe = document.getElementById('browser-view');
    const input = document.getElementById('urlInput');

    function goHome() {
        iframe.src = "https://notpulsewave.github.io/minecraft";
        input.value = "";
    }

    function processInput() {
        let val = input.value.trim();
        if (!val) return;
        
        // If it looks like a URL (contains a dot and no spaces, or starts with http), go to it.
        // Otherwise, send the query to Bing.
        const isUrl = (val.includes('.') && !val.includes(' ')) || val.startsWith('http');
        
        if (isUrl) {
            if (!val.startsWith('http')) val = 'https://' + val;
            iframe.src = val;
        } else {
            iframe.src = `https://www.bing.com/search?q=${encodeURIComponent(val)}`;
        }
    }

    // Allow Enter key to trigger search/navigation
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') processInput();
    });
</script>

</body>
</html>
